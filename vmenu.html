<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Vertical Menu - Material 3</title>

    <script type="module">
        import '@material/web/all.js';
        import { styles as typescaleStyles } from '@material/web/typography/md-typescale-styles.js';
        import '@material/web/menu/menu.js';
        import '@material/web/menu/menu-item.js';

        //import { styles as typescaleStyles4 } from '@material/web/menu/menu-item.js';
        //import { styles as typescaleStyles5 } from '@material/web/icon/icon.js';
        

        document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
        //document.adoptedStyleSheets.push(typescaleStyles2.styleSheet);
        //document.adoptedStyleSheets.push(typescaleStyles3.styleSheet);

</head>
<body>
    <span class="container">    </span>


        <h2>Material 3 Demo</h2>

        <md-icon-button>
            <md-icon>check</md-icon>
        </md-icon-button>
        <md-filled-icon-button>
            <md-icon>check</md-icon>
        </md-filled-icon-button>
        <md-filled-tonal-icon-button>
            <md-icon>check</md-icon>
        </md-filled-tonal-icon-button>
        <md-outlined-icon-button>
            <md-icon>check</md-icon>
        </md-outlined-icon-button>

        <md-icon-button href="https://google.com">
            <md-icon>check</md-icon>
        </md-icon-button>

        <!-- Note the position: relative style -->
        <span style="position: relative">
            <md-filled-button id="usage-anchor">Set with idref</md-filled-button>
            <md-menu id="usage-menu" anchor="usage-anchor">
                <md-menu-item>
                    <span slot="headline">Apple</span>
                </md-menu-item>
                <md-menu-item>
                    <span slot="headline">Banana</span>
                </md-menu-item>
                <md-menu-item>
                    <span slot="headline">Cucumber</span>
                </md-menu-item>
            </md-menu>
        </span>


        <!-- Anchor Button -->
        <span style="position: relative; inline-size: fit-content;">

            <md-icon-button id="menu-anchor-1" aria-label="Options">
                <md-icon>more_vert</md-icon>
            </md-icon-button>

            <!-- Vertical Menu -->
            <md-menu id="menu-menu-anchor-1" anchor="menu-anchor-1" menu-corner="start-start">
                <md-menu-item>
                    <md-icon>edit</md-icon>

                </md-menu-item>
                <md-menu-item>
                    <md-icon slot="start">share</md-icon>

                </md-menu-item>
                <md-divider></md-divider>
                <md-menu-item>
                    <md-icon slot="start">delete</md-icon>

                </md-menu-item>
            </md-menu>
        </span>

        Accept Terms
    </label>-->




        <script type="module">
            // This example uses MdMenu.prototype.anchorElement to set the anchor as an
            // HTMLElement reference.
            const anchorU = document.body.querySelector('#usage-anchor');
            const menuU = document.body.querySelector('#usage-menu');

            anchorU.addEventListener('click', () => { menuU.open = !menuU.open; console.log("menuU"); });

            const menu_a1 = document.body.querySelector('#menu-menu-anchor-1');
            const button_mma1 = document.body.querySelector('#menu-anchor-1');

            button_mma1.addEventListener('click', () => { menu_a1.open = !menu_a1.open; console.log("menu_a1"); });



            //menuElA1.anchorElement = anchorElA1;

</body>
