<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style>
        /* ---  #0b0b0b #005146 002723--- */
        :root {
            --bg-color: #330902;
            --text-color: #ffffff;
            --text-muted: #8c8c8c;
            --border-color: #262626;
            --accent-color: #d4af37; /* Luxury gold accent */
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-family);
            padding: 4rem 2rem;
            overflow-x: hidden;
        }

        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-title {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 4rem;
        }

        /* --- Accordion Functional Layout --- */
        .gallery-section {
            border-bottom: 1px solid var(--border-color);
        }

            .gallery-section:first-of-type {
                border-top: 1px solid var(--border-color);
            }

        .accordion-header {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-color);
            padding: 1.75rem 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            text-align: left;
            outline: none;
            transition: color 0.3s ease;
        }

            .accordion-header:hover {
                color: var(--accent-color);
            }

        .section-number-title {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .section-num {
            font-size: 0.9rem;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .view-trigger {
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: transform 0.3s ease;
        }

        /* Smooth Expanding Animation wrapper */
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), padding 0.5s ease;
            padding: 0;
        }

        .accordion-section.active .accordion-content {
            /* Handled dynamically via JavaScript for fluid animation, or predefined value */
            padding-bottom: 2.5rem;
        }

        .accordion-section.active .view-trigger span {
            transform: rotate(45deg);
        }

        /* --- Responsive Grid Layout --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        @media (max-width: 900px) {
            .grid-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .grid-item {
            position: relative;
            aspect-ratio: 5 / 4;
            background-color: #161616;
            overflow: hidden;
            cursor: pointer;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .grid-item:hover img {
            transform: scale(1.04);
        }

        /* --- Fullscreen Lightbox / Slider Modal --- */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(5, 5, 5, 0.98);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

            .lightbox.active {
                opacity: 1;
                pointer-events: auto;
            }

        .lightbox-wrapper {
            position: relative;
            width: 85%;
            max-width: 1000px;
            aspect-ratio: 3 / 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            user-select: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

            .lightbox-img.loaded {
                opacity: 1;
            }

        /* UI Controls */
        .lightbox-close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 2rem;
            cursor: pointer;
            padding: 0.5rem;
            line-height: 1;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 1.2rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            padding: 1rem;
            color: var(--text-muted);
            transition: color 0.3s;
        }

            .slider-btn:hover {
                color: var(--text-color);
            }

            .slider-btn.prev {
                left: -5rem;
            }

            .slider-btn.next {
                right: -5rem;
            }

        @media (max-width: 1100px) {
            .slider-btn.prev {
                left: 0;
                transform: translateY(-50%) translateX(-20px);
            }

            .slider-btn.next {
                right: 0;
                transform: translateY(-50%) translateX(20px);
            }
        }

        .lightbox-caption {
            margin-top: 2rem;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            text-align: center;
            max-width: 600px;
            min-height: 3rem;
        }
    </style>
</head>
<body>

    <div class="gallery-container">
        <h1 class="gallery-title">Image Gallery</h1>

        <div class="accordion-section">
            <button class="accordion-header">

                    </div>

                    </div>
                    <div class="grid-item" data-index="4" data-caption="Sparta car.">
                        <img width="1408" height="768" src="https://i.imgur.com/E3aYOJg.png" alt="SpartaPoTo" />
                        Tonkna
                    </div>
                </div>
            </div>
        </div>

        <!-- Section 02 -->
        <div class="accordion-section">
            <button class="accordion-header">
                <div class="section-number-title">
                    <span class="section-num">Nature</span>
                    <span class="section-title" style="padding-left:10px;">
                        <img width="520" height="200" src="https://i.imgur.com/OP5OVag.png" alt="After fire" />
                    </span>
                    
                </div>
                <div class="view-trigger">+ view</div>
            </button>
            <div class="accordion-content">
                <div class="grid-container">
                    <div class="grid-item" data-index="5" data-caption="After Fire">
                        <img width="1408" height="768" src="https://i.imgur.com/pMhY69f.jpeg" alt="After Fire" />
                        After Fire
                    </div>
                    <div class="grid-item" data-index="6" data-caption="Murramarang">
                        <img width="1408" height="768" src="https://i.imgur.com/yNvcTDJ.jpeg" alt="Murramarang" />
                        Murramarang
                    </div>
                    <div class="grid-item" data-index="7" data-caption="Banksias">

                    <div class="grid-item" data-index="8" data-caption="Rest">
                        <img width="1408" height="768" src="https://i.imgur.com/bZTw2zW.png" alt="Rest" />
                        Rest
                    </div>
                    <div class="grid-item" data-index="9" data-caption="Spotted Gums">

                        Spotted Gums
                    </div>
                    
                </div>
            </div>
        </div>


    </div>

    <!-- Lightbox Modal DOM Markup -->
    <div class="lightbox" id="lightboxModal">
        <button class="lightbox-close" id="closeBtn">&times;</button>
        <button class="slider-btn prev" id="prevBtn">Back</button>

        <div class="lightbox-wrapper">
            <img src="" alt="Fullscreen View" class="lightbox-img" id="lightboxImg">
        </div>

        <button class="slider-btn next" id="nextBtn">Next</button>
        <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- 1. Accordion Toggle Logic ---
            const headers = document.querySelectorAll('.accordion-header');

            headers.forEach(header => {
                header.addEventListener('click', function() {
                    const section = this.parentElement;
                    const content = this.nextElementSibling;
                    const triggerText = this.querySelector('.view-trigger');

                    section.classList.toggle('active');

                    if (section.classList.contains('active')) {
                        content.style.maxHeight = content.scrollHeight + 'px';
                        triggerText.innerHTML = '<span>&times;</span> close';
                    } else {
                        content.style.maxHeight = '0px';
                        triggerText.innerHTML = '+ view';
                    }
                });
            });

            // --- 2. Lightbox Carousel Logic ---
            const gridItems = Array.from(document.querySelectorAll('.grid-item'));
            const lightbox = document.getElementById('lightboxModal');
            const lightboxImg = document.getElementById('lightboxImg');
            const lightboxCaption = document.getElementById('lightboxCaption');
            const closeBtn = document.getElementById('closeBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            let currentIndex = 0;

            function updateLightbox(index) {
                lightboxImg.classList.remove('loaded');
                currentIndex = index;

                const currentItem = gridItems[currentIndex];
                const highResSrc = currentItem.querySelector('img').src;
                console.log(highResSrc);
                const captionText = currentItem.getAttribute('data-caption');

                lightboxImg.src = highResSrc;
                lightboxCaption.textContent = captionText || "";

                lightboxImg.onload = () => {
                    lightboxImg.classList.add('loaded');
                };
            }

            gridItems.forEach((item, index) => {
                item.addEventListener('click', () => {
                    lightbox.classList.add('active');
                    document.body.style.overflow = 'hidden'; // Lock background scroll
                    updateLightbox(index);
                });
            });

            // Close actions
            function closeLightbox() {
                lightbox.classList.remove('active');
                document.body.style.overflow = '';
                lightboxImg.src = '';
            }

            closeBtn.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) closeLightbox();
            });

            // Navigation actions
            prevBtn.addEventListener('click', () => {
                let nextIdx = currentIndex - 1;
                if (nextIdx < 0) nextIdx = gridItems.length - 1;
                updateLightbox(nextIdx);
            });

            nextBtn.addEventListener('click', () => {
                let nextIdx = currentIndex + 1;
                if (nextIdx >= gridItems.length) nextIdx = 0;
                updateLightbox(nextIdx);
            });

            // Keyboard navigation binds
            document.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('active')) return;
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowRight') nextBtn.click();
                if (e.key === 'ArrowLeft') prevBtn.click();
            });
        });
    </script>
</body>
</html>
